openapi: 3.0.3
info:
  title: nuts.family API Provider v1
  version: "1.0"
paths:
  /v1/tournaments/list:
    get:
      description: Returns list of tournaments by status
      operationId: Get tournaments list by status
      parameters:
        - name: tournament-status
          in: query
          required: false
          schema:
            type: string
            enum:
              - RegistrationOpen
              - InProgress
              - Completed
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentsListApiResponse"
        "400":
          description: "Invalid value for: query parameter tournament-status"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments/make:
    post:
      description: Returns list of opened tournaments
      operationId: Make tournament
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakeTournamentRequest"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentsListApiResponse"
        "400":
          description: "Invalid value for: body"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments/update:
    put:
      description: Returns list of opened tournaments
      operationId: Update tournament
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournamentRequest"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentsListApiResponse"
        "400":
          description: "Invalid value for: body"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments/update-player-state:
    put:
      description: Returns player state
      operationId: Update player state
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerStaterequest"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InGamePlayerState"
        "400":
          description: "Invalid value for: body"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments/get-tournament-player-state:
    get:
      description: Returns player state
      operationId: Get tournament player state
      parameters:
        - name: tournamentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InGamePlayerState"
        "400":
          description: "Invalid value for: query parameter tournamentId"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v2/api/tournaments/{tournamentId}/players/{playerId}/return-to-game:
    post:
      description: >
        Return busted player (Out / OutNotPaid) to in-game without a table:
        status InGamePaid or InGameNotPaid by entry payment, +1 unpaid rebuy,
        clear tableId and placement; placements of later bust-outs are recomputed on server.
      operationId: Return player to game
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated player state for the returning player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InGamePlayerState"
        "400":
          description: Invalid status or business rules
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v2/api/tournaments/{tournamentId}/players/{playerId}/bounty/remove:
    post:
      description: >
        Admin correction: subtract bounty share and/or reduce counted reentries.
        Does not sync with bounty eliminate events or kill lists; reentry removal
        does not mutate eliminate/kill records.
      operationId: Remove tournament player bounty or reentries
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentPlayerBountyRemoveRequest"
      responses:
        "200":
          description: Updated player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InGamePlayerState"
        "400":
          description: Invalid body or business rules
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "409":
          description: Conflict (bounty or reentry limits; message from server)
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v2/api/tournaments/{tournamentId}/bounty/eliminate:
    post:
      description: >
        Record bounty elimination; killerPlayerIds required for normal elimination (split bounty 1/N).
        With burnedStack true, killerPlayerIds may be empty per backend rules.
      operationId: Bounty eliminate
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BountyEliminateRequest"
      responses:
        "200":
          description: Created elimination event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BountyEliminateResponse"
        "400":
          description: Invalid body
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v2/api/tournaments/{tournamentId}/bounty/eliminate/undo:
    post:
      description: Full undo of one eliminate operation by eventId
      operationId: Bounty eliminate undo
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BountyEliminateUndoRequest"
      responses:
        "200":
          description: Undone
        "204":
          description: Undone (no body)
        "400":
          description: Invalid body
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments/add-player-to-tournament:
    post:
      description: Adds player to tournament
      operationId: Add player to tournament
      parameters:
        - name: tournamentId
          in: query
          required: true
          schema:
            type: string
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
        "400":
          description:
            "Invalid value for: query parameter tournamentId, Invalid value
            for: query parameter playerId"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments/remove-player-from-tournament:
    delete:
      description: Removes player from tournament
      operationId: Remove player from tournament
      parameters:
        - name: tournamentId
          in: query
          required: true
          schema:
            type: string
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
        "400":
          description:
            "Invalid value for: query parameter tournamentId, Invalid value
            for: query parameter playerId"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments-structure/make:
    post:
      description: Returns list of tournaments structures
      operationId: Make tournament structure
      parameters:
        - name: Content-Type
          in: header
          description: Must be application/json
          required: true
          schema:
            type: string
            enum:
              - application/json
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentsStructureResponse"
        "400":
          description:
            "Invalid value for: header Content-Type, Invalid value for:
            body"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments-structure/update:
    post:
      description: Returns list of tournaments structures
      operationId: Update tournament structure
      parameters:
        - name: Content-Type
          in: header
          description: Must be application/json
          required: true
          schema:
            type: string
            enum:
              - application/json
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentsStructureResponse"
        "400":
          description:
            "Invalid value for: header Content-Type, Invalid value for:
            body"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments-structure/list:
    get:
      description: Returns list of tournaments structures
      operationId: Get tournament structures
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentsStructureResponse"
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
  /v1/tournaments-structure/get:
    get:
      description: Returns tournament structure by id
      operationId: Get tournament structure by id
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentsStructureResponse"
        "400":
          description: "Invalid value for: query parameter id"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "500":
          description: unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unknown"
components:
  schemas:
    Blind:
      required:
        - level
        - id
        - smallBlind
        - bigBlind
        - ante
        - duration
      type: object
      properties:
        level:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        smallBlind:
          type: integer
          format: int64
        bigBlind:
          type: integer
          format: int64
        ante:
          type: boolean
        duration:
          type: integer
          format: int64
    BlindType:
      oneOf:
        - $ref: "#/components/schemas/Blind"
        - $ref: "#/components/schemas/Break"
    Break:
      required:
        - id
        - duration
      type: object
      properties:
        id:
          type: integer
          format: int64
        duration:
          type: integer
          format: int64
    BountyEliminateRequest:
      required:
        - eliminatedPlayerId
        - type
        - killerPlayerIds
      type: object
      properties:
        eliminatedPlayerId:
          type: string
        type:
          type: string
          enum:
            - Rebuy
            - Out
        killerPlayerIds:
          type: array
          items:
            type: string
        burnedStack:
          type: boolean
        burnedChips:
          type: integer
          format: int64
    TournamentPlayerBountyRemoveRequest:
      type: object
      description: >
        At least one field should be present. Omitted or zero means no change for that axis.
      properties:
        bountyCountToRemove:
          type: number
          format: double
          description: Bounty share to subtract (fractional allowed).
        reentryCountToRemove:
          type: integer
          minimum: 1
          description: Number of counted reentries to remove.
    BountyEliminateResponse:
      required:
        - eventId
      type: object
      properties:
        eventId:
          type: string
    BountyEliminateUndoRequest:
      required:
        - eventId
      type: object
      properties:
        eventId:
          type: string
    InGameBonusUpdateRequest:
      required:
        - bonus
        - count
      type: object
      properties:
        bonus:
          type: string
          enum:
            - EarlyBird
            - Hookah
            - Diller
        count:
          type: integer
          format: int64
    InGamePlayerState:
      required:
        - playerId
        - status
        - reentryCount
        - bountyCount
        - paidReentryCount
      type: object
      properties:
        playerId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - Registered
            - InGamePaid
            - InGameNotPaid
            - Out
        tableId:
          type: integer
          format: int64
        entyPaymentMethod:
          type: string
          enum:
            - Cache
            - CreditCard
            - Free
        reentryCount:
          type: integer
          format: int64
        reentyPaymentMethod:
          type: string
          enum:
            - Cache
            - CreditCard
            - Free
        bountyCount:
          type: integer
          format: int64
        paidReentryCount:
          type: integer
          format: int64
        allowedReentryCount:
          type: integer
          format: int64
          minimum: 0
          description: >
            Effective max reentries for this tournament (0 if freeze-out, else maxReentries).
            Use for UI limits; always a number when present.
        entryPaidAmount:
          type: integer
          format: int64
          description: Factually recorded entry payment (e.g. after discount).
        reentryPaidAmounts:
          type: array
          items:
            type: integer
            format: int64
          description: Paid amounts per reentry, same order as expanded payment methods list.
        bonuses:
          type: array
          items:
            $ref: "#/components/schemas/Tuple2_A_B"
    MakeTournamentRequest:
      required:
        - name
        - date
        - structure
      type: object
      properties:
        name:
          type: string
        date:
          type: integer
          format: int64
        structure:
          $ref: "#/components/schemas/MakeTournamentStructureRequest"
    MakeTournamentStructureRequest:
      required:
        - name
        - playersLimit
        - stackSize
        - freezeOutEnabled
      type: object
      properties:
        name:
          type: string
        playersLimit:
          type: integer
          format: int64
        stackSize:
          type: integer
          format: int64
        freezeOutEnabled:
          type: boolean
        maxReentries:
          type: integer
          format: int64
          minimum: 0
          description: >
            Max reentries per player when not freeze-out; omit to use server default (e.g. 5).
        blinds:
          type: array
          items:
            $ref: "#/components/schemas/BlindType"
    NotFound:
      required:
        - what
      type: object
      properties:
        what:
          type: string
    TournamentsListApiResponse:
      required:
        - id
        - name
        - date
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: integer
          format: int64
    TournamentsStructureResponse:
      required:
        - id
        - name
        - playersLimit
        - bigBlindOnStart
        - smallBlindOnStart
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        playersLimit:
          type: integer
          format: int64
        bigBlindOnStart:
          type: integer
          format: int64
        smallBlindOnStart:
          type: integer
          format: int64
        entry_price:
          type: integer
          format: int64
          description: Default full entry price (same units as cash register).
        reentry_price:
          type: integer
          format: int64
          description: Default full price for one reentry.
        max_reentries:
          type: integer
          format: int64
          minimum: 0
          description: Saved reentry cap per player (non-freeze-out); server default if omitted.
        allowed_reentry_count:
          type: integer
          format: int64
          minimum: 0
          description: Effective reentry limit derived from freeze-out and maxReentries.
    Tuple2_A_B:
      required:
        - _1
        - _2
      type: object
      properties:
        _1:
          type: string
          enum:
            - EarlyBird
            - Hookah
            - Diller
        _2:
          type: integer
          format: int64
    Unknown:
      required:
        - code
        - msg
      type: object
      properties:
        code:
          type: integer
          format: int32
        msg:
          type: string
    UpdatePlayerStaterequest:
      required:
        - tournamentId
        - playerId
      type: object
      properties:
        tournamentId:
          type: string
        playerId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - Registered
            - InGamePaid
            - InGameNotPaid
            - Out
        entyPaymentMethod:
          type: string
          enum:
            - Cache
            - CreditCard
            - Free
        reentyPaymentMethod:
          type: string
          enum:
            - Cache
            - CreditCard
            - Free
        tableId:
          type: integer
          format: int64
        reentryCount:
          type: integer
          format: int64
        bountyCount:
          type: integer
          format: int64
        paidReentryCount:
          type: integer
          format: int64
        bonuses:
          type: array
          items:
            $ref: "#/components/schemas/InGameBonusUpdateRequest"
    UpdateTournamentRequest:
      required:
        - id
        - name
        - date
        - structure
        - status
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: integer
          format: int64
        structure:
          $ref: "#/components/schemas/MakeTournamentStructureRequest"
        status:
          type: string
          enum:
            - RegistrationOpen
            - InProgress
            - Completed
